<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PireFlix — Criar conta</title>

    <link rel="stylesheet" href="../css/register.css">
</head>

<body>

    <!-- Fundo animado -->
    <div class="background">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>
        <div class="particles"></div>
    </div>

    <!-- Logo -->
    <header class="logo">
        <span>Pire</span><strong>Flix</strong>
    </header>

    <!-- Register -->
    <main class="register-container">

        <div class="register-card">

            <div class="register-header">

                <div class="icon">
                    +
                </div>

                <h1>Crie sua conta</h1>

                <p>
                    Crie sua conta e comece a assistir.
                </p>

            </div>

            <form id="registerForm">

                <!-- Nome -->
                <div class="input-group">

                    <label for="name">
                        Nome
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ●
                        </span>

                        <input
                            type="text"
                            id="name"
                            placeholder="Seu nome"
                            autocomplete="name"
                            required
                        >

                    </div>

                </div>

                <!-- Email -->
                <div class="input-group">

                    <label for="email">
                        E-mail
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            @
                        </span>

                        <input
                            type="email"
                            id="email"
                            placeholder="seu@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>

                <!-- Senha -->
                <div class="input-group">

                    <label for="password">
                        Senha
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ●
                        </span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Crie uma senha"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                        >
                            Mostrar
                        </button>

                    </div>

                </div>

                <!-- Confirmar senha -->
                <div class="input-group">

                    <label for="confirmPassword">
                        Confirmar senha
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ●
                        </span>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Digite a senha novamente"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="toggleConfirmPassword"
                        >
                            Mostrar
                        </button>

                    </div>

                </div>

                <!-- Mensagem -->
                <div id="message" class="message"></div>

                <!-- Botão -->
                <button
                    type="submit"
                    class="register-button"
                    id="registerButton"
                >

                    <span class="button-text">
                        Criar conta
                    </span>

                    <span class="loader"></span>

                </button>

                <!-- Divisor -->
                <div class="divider">
                    <span>ou</span>
                </div>

                <!-- Google -->
                <button
                    type="button"
                    class="social-register"
                >
                    <span>G</span>
                    Continuar com Google
                </button>

            </form>

            <!-- Login -->
            <p class="login">

                Já possui uma conta?

                <a href="login.html">
                    Entrar
                </a>

            </p>

        </div>

    </main>

    <footer>
        © 2026 PireFlix. Todos os direitos reservados.
    </footer>

    <script src="../javascript/register.js"></script>

</body>

</html>
