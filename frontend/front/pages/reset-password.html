<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LUNEFLIX - Nova senha</title>
    <link rel="stylesheet" href="../css/reset-password.css">
</head>
<body>
    <main>
        <h1>Crie uma nova senha</h1>
        <p>O link expira em 30 minutos e só pode ser usado uma vez.</p>
        <form id="resetForm">
            <label for="password">Nova senha</label>
            <input id="password" type="password" minlength="6" required autocomplete="new-password">
            <label for="confirmPassword">Confirmar senha</label>
            <input id="confirmPassword" type="password" minlength="6" required autocomplete="new-password">
            <button type="submit">Salvar nova senha</button>
        </form>
        <p id="message" role="status"></p>
    </main>
    <script src="../javascript/config.js"></script>
    <script src="../javascript/reset-password.js"></script>
</body>
</html>
